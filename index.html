<style>
:root{

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--wash)}

.iconbtn svg{width:16px;height:16px}

.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}

.btn:active{background:var(--teal-deep);border-color:var(--teal-deep)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}

.chip{display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;border:1px solid var(--teal-line);color:var(--teal-deep);background:#fff;border-radius:6px;padding:4px 8px;white-space:nowrap}

.pinrow input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-wash)}

/* tabs */
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;max-width:520px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(10px + var(--safe-b))}
nav.tabs button{border:0;background:none;cursor:pointer;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font:inherit;font-size:9.5px;font-weight:500}

.fab{position:fixed;right:max(16px,calc(50vw - 244px));bottom:calc(86px + var(--safe-b));z-index:41;border:0;cursor:pointer;background:var(--ink);color:#fff;border-radius:999px;padding:13px 18px 13px 15px;font:inherit;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -8px rgba(11,15,16,.55)}

/* records */

.rec .ic{width:34px;height:34px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;background:var(--teal-wash);color:var(--teal-deep)}
.rec .ic svg{width:16px;height:16px}
.rec .ic.lab{background:#eef2fb;color:#2b4a86}.rec .ic.rx{background:#f2eefb;color:#5a3f96}
.rec .ic.imaging{background:#eef4f3;color:#0d5f57}.rec .ic.dx{background:#fdf3e7;color:var(--amber)}
.rec .ic.proc{background:var(--red-wash);color:var(--red)}.rec .ic.vac{background:#edf6ef;color:#2f6b45}
.rec .bd{flex:1;min-width:0}
.rec .t{font-size:13.5px;font-weight:600;line-height:1.35}
.rec .m{font-size:11.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .d{font-family:'IBM Plex Mono',monospace;font-size:9.5px;color:var(--faint);flex:0 0 auto;letter-spacing:.02em;padding-top:2px}
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 16px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;font-size:12px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:8px 13px;cursor:pointer;font-family:inherit}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.searchwrap{padding:10px 16px 2px;position:relative}
.searchwrap input{width:100%;font:inherit;font-size:14px;padding:11px 12px 11px 36px;border:1px solid var(--line);border-radius:11px;background:#fff}
.searchwrap svg{position:absolute;left:28px;top:22px;width:15px;height:15px;color:var(--faint)}
.tlgroup{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.tlgroup::after{content:'';flex:1;height:1px;background:var(--line2)}
.empty{text-align:center;padding:52px 30px;color:var(--muted)}

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line2);font-size:13px}

table.vals th{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:500;padding:0 0 8px}
table.vals td{padding:9px 0;border-top:1px solid var(--line2)}
table.vals td.n{font-family:'IBM Plex Mono',monospace;text-align:right}
table.vals tr.hi td.n{color:var(--red);font-weight:500}
.medrow{display:flex;justify-content:space-between;gap:10px;padding:11px 14px;border-top:1px solid var(--line2);font-size:13px}
.medrow:first-child{border-top:0}
.attach{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-top:8px;cursor:pointer;background:#fff;width:100%;font:inherit;text-align:left}
.attach .ic{width:34px;height:34px;border-radius:8px;background:var(--teal-wash);color:var(--teal-deep);display:grid;place-items:center;flex:0 0 auto}
.attach .ic svg{width:16px;height:16px}
.attach img.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:0 0 auto}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line2);stroke-width:1}
.chart .band{fill:var(--teal-wash);opacity:.55}
.chart .bandline{stroke:var(--teal-line);stroke-dasharray:3 3;stroke-width:1}

.gatecard{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px 22px;box-shadow:0 30px 60px -30px rgba(11,15,16,.35)}
.gate .wordmark{font-size:26px}
.codebox{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.08em;text-align:center;background:var(--wash);border:1.5px dashed var(--teal-line);border-radius:12px;padding:16px;color:var(--teal-deep);user-select:all}
.steps{display:flex;gap:6px;margin-bottom:18px}
.steps i{height:3px;flex:1;border-radius:2px;background:var(--line)}

/* emergency */
.ecard{border:1px solid #f1cdc9;border-radius:var(--r);background:linear-gradient(180deg,#fff,#fdf7f6);padding:16px}
.bigblood{font-family:'Playfair Display',serif;font-size:42px;font-weight:800;color:var(--red);line-height:1}

/* toast + sheet */
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + var(--safe-b));z-index:80;max-width:488px;margin:0 auto;background:var(--ink);color:#fff;border-radius:12px;padding:13px 15px;font-size:12.5px;line-height:1.5;display:none;align-items:flex-start;gap:9px;box-shadow:0 14px 30px -12px rgba(11,15,16,.7)}

.toast svg{width:15px;height:15px;flex:0 0 auto;margin-top:1px;color:#7fd0c3}
@keyframes up{from{transform:translateY(10px);opacity:.5}to{transform:none;opacity:1}}
.qrbox{display:grid;place-items:center;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px}
.qrbox canvas{width:200px;height:200px}

/* urdu */
body.ur #app{direction:rtl}
body.ur .u{font-family:'Noto Nastaliq Urdu',serif;line-height:2}
body.ur h1.ttl,body.ur .rec .t{font-family:'Noto Nastaliq Urdu',serif;font-weight:600;line-height:1.9}
body.ur .mono,body.ur .rec .d,body.ur .chip,body.ur .lbl{direction:ltr;unicode-bidi:embed}

body.ur table.vals td,body.ur .medrow,body.ur .kv .v{direction:ltr}
body.ur .searchwrap svg{left:auto;right:28px}
body.ur .searchwrap input{padding:11px 36px 11px 12px}
@media(min-width:560px){ .fab{right:calc(50vw - 244px)} }
</style>

<script>
'use strict';
/* =====================================================================
   MedVault Web v0.1.0 — the real application (device mode)
   ---------------------------------------------------------------------
   Records are AES-256-GCM encrypted with per-record keys wrapped under a
   master key derived from your PIN (PBKDF2-SHA256, 600k iterations) —
   the same tested hierarchy as the Phase 1 scaffold (SPEC §4).
   DEVICE MODE: everything lives in this browser's IndexedDB. Connecting
   a Supabase backend (SPEC §2) turns on sync, sign-in and QR consent.
   ===================================================================== */

/* ---------------- backend config (filled at connect time) ---------------- */
const BACKEND = {
  url:'https://dxaolrxrpdkrmonwcwth.supabase.co',
  anonKey:'sb_publishable_Y0uxVF0NYpjQqNyNBZr-5g_CgV_2p_N',
  functionsUrl:'https://dxaolrxrpdkrmonwcwth.supabase.co/functions/v1',
  // Host-agnostic: derive our own origin so magic-link + gateway work on ANY host.
  get appUrl(){ return location.origin + location.pathname.replace(/[^/]*$/, ''); },
  get gatewayUrl(){ return this.appUrl + 'gateway.html'; }
};

/* ---------------- crypto core (mirrors @medvault/core, tested) ---------------- */
const subtle=crypto.subtle, te=new TextEncoder(), td=new TextDecoder();
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
const PBKDF2_ITERS=600000, GCM_NONCE=12;
const b64e=b=>{let s='';for(const x of new Uint8Array(b))s+=String.fromCharCode(x);return btoa(s)};
const b64d=s=>{const t=atob(s);const o=new Uint8Array(t.length);for(let i=0;i<t.length;i++)o[i]=t.charCodeAt(i);return o};
async function deriveMK(pin,salt,iters){
  const km=await subtle.importKey('raw',te.encode(String(pin)),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:iters||PBKDF2_ITERS},km,256));
}
async function aeadSeal(key,pt,aad){
  const k=await subtle.importKey('raw',key,'AES-GCM',false,['encrypt']);
  const n=rand(GCM_NONCE);
  const data=typeof pt==='string'?te.encode(pt):pt;
  const ct=new Uint8Array(await subtle.encrypt({name:'AES-GCM',iv:n,additionalData:te.encode(aad||'')},k,data));
  const out=new Uint8Array(n.length+ct.length); out.set(n); out.set(ct,n.length); return out;
}
async function aeadOpen(key,sealed,aad){
  const k=await subtle.importKey('raw',key,'AES-GCM',false,['decrypt']);
  return new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:sealed.slice(0,GCM_NONCE),additionalData:te.encode(aad||'')},k,sealed.slice(GCM_NONCE)));
}
const sealJson=async(k,id,obj)=>aeadSeal(k,JSON.stringify(obj),'record:'+id);
const openJson=async(k,id,sl)=>JSON.parse(td.decode(await aeadOpen(k,sl,'record:'+id)));
const wrapDek=(mk,dek,id)=>aeadSeal(mk,dek,'dek:'+id);
const unwrapDek=(mk,w,id)=>aeadOpen(mk,w,'dek:'+id);
function newRecoveryCode(){const a='ABCDEFGHJKMNPQRSTVWXYZ23456789';const b=rand(16);let s='';for(let i=0;i<16;i++){if(i&&i%4===0)s+='-';s+=a[b[i]%a.length]}return s}
const recoveryKey=(code,salt)=>deriveMK(code.replace(/-/g,'').toUpperCase(),salt);

/* ---------------- storage adapter ----------------
   Real IndexedDB when the host allows it. Preview hosts (CSP-sandboxed pages)
   deny storage entirely — then we run on an in-memory store and SAY SO in the
   UI. Production hosting restores persistence with zero code changes. */
const STORAGE={mode:'idb'};   // 'idb' | 'session'
const MEM={meta:new Map(),records:new Map(),record_keys:new Map(),files:new Map()};
const KEYPATH={meta:'id',records:'id',record_keys:'record_id',files:'id'};
const DB_NAME='medvault-app', DB_VER=1;
let _db=null, _idbDead=false;
function idb(){
  if(_idbDead) return Promise.reject(new Error('idb-denied'));
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    let rq;
    try{ rq=indexedDB.open(DB_NAME,DB_VER); }
    catch(e){ _idbDead=true; STORAGE.mode='session'; return rej(e); }
    rq.onupgradeneeded=()=>{
      const d=rq.result;
      d.createObjectStore('meta',{keyPath:'id'});
      d.createObjectStore('records',{keyPath:'id'});
      d.createObjectStore('record_keys',{keyPath:'record_id'});
      d.createObjectStore('files',{keyPath:'id'});
    };
    rq.onsuccess=()=>{_db=rq.result;res(_db)};
    rq.onerror=()=>{_idbDead=true; STORAGE.mode='session'; rej(rq.error)};
  });
}
async function dbPut(store,v){
  try{ const d=await idb(); return await new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)}); }
  catch(e){ MEM[store].set(v[KEYPATH[store]],v); }
}
async function getOne(store,key){
  try{ const d=await idb(); return await new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); }
  catch(e){ return MEM[store].get(key); }
}
async function getAll(store){
  try{ const d=await idb(); return await new Promise((res,rej)=>{const r=d.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}); }
  catch(e){ return [...MEM[store].values()]; }
}
async function dbDel(store,key){
  try{ const d=await idb(); return await new Promise((res,rej)=>{const t=d.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=res;t.onerror=()=>rej(t.error)}); }
  catch(e){ MEM[store].delete(key); }
}
/* localStorage may be denied on the same hosts */
const LSMEM=new Map();
const safeLS={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return LSMEM.get(k)??null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ LSMEM.set(k,v); } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ LSMEM.delete(k); } }
};

/* ---------------- connected layer (Supabase) ---------------- */
const hex2=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const pgHex=u8=>'\\x'+hex2(u8);
function fromPgHex(v){ if(typeof v!=='string'||!v.startsWith('\\x')) return null;
  const h=v.slice(2), o=new Uint8Array(h.length/2);
  for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16); return o; }
async function sha256hex(str){ return hex2(await subtle.digest('SHA-256', te.encode(str))); }
async function hkdf(secret,info){
  const km=await subtle.importKey('raw',secret,'HKDF',false,['deriveBits']);
  return new Uint8Array(await subtle.deriveBits({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:te.encode(info)},km,256));
}
const grantAuthHash=async G=>hex2(await subtle.digest('SHA-256', await hkdf(G,'medvault/grant-auth/v1')));
const wrapDekForGrant=async(G,dek,rid)=>aeadSeal(await hkdf(G,'medvault/grant-wrap/v1'),dek,'grant-dek:'+rid);
function newDisplayToken(){const C='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const r=rand(8);let a='',d='';
  for(let i=0;i<4;i++)a+=C[r[i]%C.length]; for(let i=4;i<8;i++)d+=String(r[i]%10); return 'MV-'+a+'-'+d;}
const b64u=u8=>b64e(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

let SB=null;
function sb(){
  if(SB) return SB;
  if(!BACKEND.url||!window.supabase) return null;
  SB=window.supabase.createClient(BACKEND.url,BACKEND.anonKey,{auth:{
    persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'implicit',
    storage:{getItem:k=>safeLS.get(k),setItem:(k,v)=>safeLS.set(k,v),removeItem:k=>safeLS.del(k)}
  }});
  return SB;
}
async function sbInit(){
  const c=sb(); if(!c) return;
  try{
    const {data}=await c.auth.getSession();
    S.session=data&&data.session||null;
    c.auth.onAuthStateChange((_e,sess)=>{ S.session=sess; updateModePill(); });
    if(S.session&&S.mk) await ensureProfile();
  }catch(e){}
  updateModePill();
}
async function sendOtp(email){
  const c=sb(); if(!c) return {error:'no backend'};
  const {error}=await c.auth.signInWithOtp({email:email,options:{shouldCreateUser:true,emailRedirectTo:BACKEND.appUrl}});
  return {error:error?(error.message||String(error)):null};
}
async function verifyOtpCode(email,code){
  const c=sb();
  const {data,error}=await c.auth.verifyOtp({email:email,token:code,type:'email'});
  if(error) return {error:error.message||String(error)};
  S.session=data.session;
  if(S.mk) await ensureProfile();
  return {error:null};
}
async function signOutSb(){ const c=sb(); if(c) await c.auth.signOut(); S.session=null; S.profileId=null; render(); }

async function ensureProfile(){
  const c=sb(); if(!c||!S.session||!S.meta) return;
  try{
    let {data:rows}=await c.from('profiles').select('id').eq('auth_user_id',S.session.user.id).limit(1);
    let pid=rows&&rows[0]&&rows[0].id;
    if(!pid){
      const ins=await c.from('profiles').insert({auth_user_id:S.session.user.id,full_name:S.meta.name,
        city:S.meta.city||null,cnic_masked:S.meta.cnic_masked||null}).select('id').single();
      if(ins.error){ S.syncMsg='profile: '+ins.error.message; return; }
      pid=ins.data.id;
    }
    S.profileId=pid;
    const {data:pk}=await c.from('profile_keys').select('profile_id,kdf_salt').eq('profile_id',pid).maybeSingle();
    const localSalt=pgHex(b64d(S.meta.salt));
    if(!pk){
      const up=await c.from('profile_keys').insert({profile_id:pid,kdf:S.meta.kdf,kdf_salt:localSalt,
        mk_verify:pgHex(b64d(S.meta.verify)),recovery_salt:pgHex(b64d(S.meta.recovery_salt)),
        mk_wrapped_recovery:pgHex(b64d(S.meta.mk_wrapped_recovery))});
      if(up.error){ S.syncMsg='keys: '+up.error.message; return; }
    } else if(pk.kdf_salt!==localSalt){
      S.syncBlocked='This account already holds a different vault (from another device). Sync is paused to protect both — v0.2 does not merge vaults.';
      updateModePill(); return;
    }
    S.syncBlocked=null;
    await syncNow();
  }catch(e){ S.syncMsg=String(e&&e.message||e); }
}
const canSync=()=>!!(sb()&&S.session&&S.profileId&&S.mk&&!S.syncBlocked);
async function pushSync(){
  if(!canSync()) return 0;
  const c=sb(); let pushed=0;
  const recs=await getAll('records');
  const keys={}; for(const k of await getAll('record_keys')) keys[k.record_id]=k;
  for(const r of recs){
    if(r.synced_at && r.synced_at>=r.updated_at) continue;
    const row={id:r.id,profile_id:S.profileId,record_type:r.record_type,record_date:r.record_date,
      source:r.source,payload_ver:r.payload_ver||1,payload_cipher:pgHex(b64d(r.payload_cipher_b64||r.payload_cipher)),
      updated_at:r.updated_at,deleted_at:r.deleted_at||null};
    const res=await c.from('records').upsert(row,{onConflict:'id'});
    if(res.error){ S.syncMsg='push: '+res.error.message; continue; }
    const k=keys[r.id];
    if(k) await c.from('record_keys').upsert({record_id:r.id,wrapped_dek:pgHex(b64d(k.wrapped_dek))},{onConflict:'record_id'});
    r.synced_at=nowIso(); await dbPut('records',r); pushed++;
  }
  return pushed;
}
async function pullSync(){
  if(!canSync()) return 0;
  const c=sb(); let pulled=0;
  const {data:rows,error}=await c.from('records').select('*').eq('profile_id',S.profileId);
  if(error){ S.syncMsg='pull: '+error.message; return 0; }
  const {data:krows}=await c.from('record_keys').select('*');
  const kmap={}; for(const k of (krows||[])) kmap[k.record_id]=k;
  for(const r of (rows||[])){
    const loc=await getOne('records',r.id);
    if(loc && loc.updated_at>=r.updated_at) continue;
    const cipher=fromPgHex(r.payload_cipher); if(!cipher) continue;
    await dbPut('records',{id:r.id,record_type:r.record_type,record_date:r.record_date,source:r.source,
      payload_ver:r.payload_ver,payload_cipher:b64e(cipher),created_at:r.created_at,updated_at:r.updated_at,
      deleted_at:r.deleted_at,synced_at:nowIso()});
    const k=kmap[r.id];
    if(k){ const w=fromPgHex(k.wrapped_dek); if(w) await dbPut('record_keys',{record_id:r.id,wrapped_dek:b64e(w)}); }
    pulled++;
  }
  return pulled;
}
async function syncNow(){
  if(!canSync()) return;
  S.syncMsg='syncing…'; if(S.route==='settings') render();
  const a=await pushSync(), b=await pullSync();
  S.lastSync=nowIso(); S.syncMsg='';
  if(S.route==='settings'||S.route==='vault'||S.route==='timeline') render();
  if(a||b) toast('Synced — '+a+' up, '+b+' down');
}

    p_actor_name:S.meta.name,p_action:action,p_detail:detail,p_grant_id:grantId||null}); }catch(e){}
}

async function vaultExists(){ return !!(await getOne('meta','vault')); }
async function createVault(o){
  const salt=rand(16), mk=await deriveMK(o.pin,salt);
  const verify=await aeadSeal(mk,'medvault-verify','verify');
  const code=newRecoveryCode(), rsalt=rand(16), rk=await recoveryKey(code,rsalt);
  const mkWrapped=await aeadSeal(rk,mk,'mk-recovery');
  const meta={id:'vault',v:1,kdf:'pbkdf2-sha256-600000',salt:b64e(salt),verify:b64e(verify),
    recovery_salt:b64e(rsalt),mk_wrapped_recovery:b64e(mkWrapped),
    name:o.name,name_ur:o.name_ur||'',blood:o.blood||'',city:o.city||'',cnic_masked:o.cnic_masked||'',
    dob_year:o.dob_year||'',sex:o.sex||'',allergies:o.allergies||[],conditions:[],meds:[],contacts:[],
    created_at:nowIso()};
  await dbPut('meta',meta);
  S.mk=mk; S.meta=meta;
  await writeEmergency();
  return code;
}
async function unlock(pin){
  const m=await getOne('meta','vault'); if(!m) return false;
  try{
    const mk=await deriveMK(pin,b64d(m.salt));
    const v=td.decode(await aeadOpen(mk,b64d(m.verify),'verify'));
    if(v!=='medvault-verify') return false;
    S.mk=mk; S.meta=m; return true;
  }catch(e){ return false; }
}
async function recoverWithCode(code,newPin){
  const m=await getOne('meta','vault'); if(!m||!m.mk_wrapped_recovery) return false;
  try{
    const rk=await recoveryKey(code,b64d(m.recovery_salt));
    const mk=await aeadOpen(rk,b64d(m.mk_wrapped_recovery),'mk-recovery');
    // re-derive under the new PIN
    const salt=rand(16), mk2=await deriveMK(newPin,salt);
    // Re-wrap every record DEK under the new MK
    const keys=await getAll('record_keys');
    for(const k of keys){
      const dek=await unwrapDek(mk,b64d(k.wrapped_dek),k.record_id);
      await dbPut('record_keys',{record_id:k.record_id,wrapped_dek:b64e(await wrapDek(mk2,dek,k.record_id))});
    }
    const code2=newRecoveryCode(), rsalt2=rand(16), rk2=await recoveryKey(code2,rsalt2);
    m.salt=b64e(salt); m.verify=b64e(await aeadSeal(mk2,'medvault-verify','verify'));
    m.recovery_salt=b64e(rsalt2); m.mk_wrapped_recovery=b64e(await aeadSeal(rk2,mk2,'mk-recovery'));
    await dbPut('meta',m);
    S.mk=mk2; S.meta=m;
    return code2;
  }catch(e){ return false; }
}

async function saveRecord(rec,payload,fileBlobs){
  const dek=rand(32);
  const cipher=await sealJson(dek,rec.id,payload);
  await dbPut('records',{...rec,payload_cipher:b64e(cipher),created_at:rec.created_at||nowIso(),updated_at:nowIso()});
  await dbPut('record_keys',{record_id:rec.id,wrapped_dek:b64e(await wrapDek(S.mk,dek,rec.id))});
  for(const f of (fileBlobs||[])){
    const fdek=rand(32);
    const buf=new Uint8Array(await f.blob.arrayBuffer());
    const sealed=await aeadSeal(fdek,buf,'file:'+f.id);
    await dbPut('files',{id:f.id,record_id:rec.id,mime:f.blob.type||'application/octet-stream',size:f.blob.size,
      blob:sealed.buffer,file_dek_wrapped:b64e(await aeadSeal(dek,fdek,'fdek:'+f.id)),created_at:nowIso()});
  }
}
async function loadRecords(){
  const rows=(await getAll('records')).filter(r=>!r.deleted_at);
  rows.sort((a,b)=>a.record_date<b.record_date?1:a.record_date>b.record_date?-1:0);
  const out=[];
  for(const r of rows){
    try{
      const k=await getOne('record_keys',r.id);
      const dek=await unwrapDek(S.mk,b64d(k.wrapped_dek),r.id);
      out.push({...r,payload:await openJson(dek,r.id,b64d(r.payload_cipher)),_dek:dek});
    }catch(e){ out.push({...r,payload:{title:'[decryption failed]'},_bad:true}); }
  }
  return out;
}
async function openFile(fileRow,dek){
  const fdek=await aeadOpen(dek,b64d(fileRow.file_dek_wrapped),'fdek:'+fileRow.id);
  const pt=await aeadOpen(fdek,new Uint8Array(fileRow.blob),'file:'+fileRow.id);
  return new Blob([pt],{type:fileRow.mime});
}

async function renderGate(){

function pinInputs(idPrefix,n){
  let h='<div class="pinrow">';
  for(let i=0;i<n;i++) h+='<input id="'+idPrefix+i+'" inputmode="numeric" maxlength="1" autocomplete="off">';
  return h+'</div>';
}
function wirePins(prefix,n,done){
  for(let i=0;i<n;i++){
    const el=document.getElementById(prefix+i);
    el.addEventListener('input',()=>{
      el.value=el.value.replace(/\D/g,'').slice(0,1);
      if(el.value&&i<n-1) document.getElementById(prefix+(i+1)).focus();
      const pin=[...Array(n)].map((_,j)=>document.getElementById(prefix+j).value).join('');
      if(pin.length===n) done(pin);
    });
    el.addEventListener('keydown',e=>{ if(e.key==='Backspace'&&!el.value&&i>0) document.getElementById(prefix+(i-1)).focus(); });
  }
}
function gateUnlock(msg){
  return '<div class="wordmark" style="margin-bottom:4px">Med<span>Vault</span></div>'+

let ENROLL={};
function enrollWire(step){
  if(step===2){ wirePins('ep',4,()=>{}); wirePins('ep2',4,()=>{}); const f=$('#ep0'); if(f)f.focus(); }
}
async function enrollNext(step){
  if(step===1){
    const name=($('#e_name').value||'').trim();
    if(!name){ $('#e_name').style.borderColor='var(--red)'; $('#e_name').focus(); return; }
    ENROLL={name:name,blood:$('#e_blood').value,dob_year:($('#e_dob').value||'').trim(),city:($('#e_city').value||'').trim(),
      allergies:($('#e_all').value||'').split(',').map(s=>s.trim()).filter(Boolean)};
    $('#gatecard').innerHTML=gateEnroll(2); enrollWire(2); return;
  }
  if(step===2){
    const p1=[0,1,2,3].map(i=>$('#ep'+i).value).join(''), p2=[0,1,2,3].map(i=>$('#ep2'+i).value).join('');
    if(!/^\d{4}$/.test(p1)){ $('#epmsg').innerHTML='<div class="simnote red" style="margin-top:12px">'+ICON.alert+'<span>Enter all four digits.</span></div>'; return; }
    if(p1!==p2){ $('#epmsg').innerHTML='<div class="simnote red" style="margin-top:12px">'+ICON.alert+'<span>PINs do not match.</span></div>'; return; }
    $('#gatecard').style.opacity=.6;
    const code=await createVault({...ENROLL,pin:p1});
    $('#gatecard').style.opacity=1;
    $('#gatecard').innerHTML=gateEnroll(3,{code:code}); return;
  }
  if(step===3){
    if(!$('#e_ok').checked){ toast('Please confirm you wrote the recovery code down'); return; }
    $('#gate').innerHTML=''; go('vault');
    if(sb()&&S.session) ensureProfile();
    toast('Vault created — everything you add is encrypted on this device');
  }
}

function flagAnalyte(a){
  const m=/^\s*([\d.]+)\s*[–-]\s*([\d.]+)/.exec(a.range||'');
  const v=parseFloat(a.v);
  if(!m||isNaN(v)) return false;
  return v<parseFloat(m[1])||v>parseFloat(m[2]);
}

  const f=await getOne('files',fid); const k=await getOne('record_keys',rid);

    const url=URL.createObjectURL(blob);
    window.open(url,'_blank');
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast('Could not decrypt this file'); }
}

  let h='<div class="sec"><div class="lbl">'+t('trends').toUpperCase()+'</div><h1 class="ttl u">'+(S.lang==='ur'?'لیب رجحانات':'Lab trends')+'</h1><p class="note u">'+t('trends_note')+'</p></div>';
  if(!keys.length) return h+'<div class="empty">'+ICON.trend+'<p>Add lab results with numeric values and trends chart themselves here.</p></div>';
  if(!S.analyte||!keys.includes(S.analyte)) S.analyte=keys[0];
  const L=series[S.analyte];
  h+='<div class="filters">'+keys.map(k=>'<button class="fchip'+(S.analyte===k?' on':'')+'" onclick="S.analyte=\''+esc(k).replace(/'/g,"\\'")+'\';render()">'+esc(k)+'</button>').join('')+'</div>';
  const last=L.pts[L.pts.length-1];
  h+='<div class="pad"><div class="card cardpad">'+
    '<div style="display:flex;align-items:flex-end;gap:10px;margin-bottom:6px"><div style="font-family:\'Playfair Display\',serif;font-size:32px;font-weight:700;line-height:1">'+last[1]+'</div>'+
    '<div class="tiny" style="margin-bottom:4px">'+esc(L.u)+'</div><div style="flex:1"></div><div class="mono tiny" style="text-align:right">'+dShort(last[0])+'</div></div>'+
    (L.pts.length>=2?chart(L):'<div class="tiny" style="padding:10px 0">One value so far — add another '+esc(L.n)+' result and the trend line appears.</div>')+
    (L.range?'<div class="tiny" style="margin-top:7px">Reference '+esc(L.range)+' '+esc(L.u)+'</div>':'')+'</div>';
  h+='<div style="height:10px"></div><div class="card cardpad"><table class="vals"><tr><th>Date</th><th style="text-align:right">Value</th></tr>'+
    L.pts.slice().reverse().map(p=>'<tr><td>'+dLong(p[0])+'</td><td class="n">'+p[1]+' '+esc(L.u)+'</td></tr>').join('')+'</table></div></div>';
  return h+'<div style="height:16px"></div>';
}
function chart(L){
  const W=360,H=150,PL=34,PR=12,PT=12,PB=20;
  const pts=L.pts, vals=pts.map(p=>p[1]);
  let band=null;
  const m=/^\s*([\d.]+)\s*[–-]\s*([\d.]+)/.exec(L.range||'');
  if(m) band=[parseFloat(m[1]),parseFloat(m[2])];
  const dmin=Math.min(...vals),dmax=Math.max(...vals);
  const range=(dmax-dmin)||Math.max(1,dmax*.15);
  let lo=dmin-range*.35, hi=dmax+range*.35;
  if(band){ lo=Math.min(lo,band[0]-range*.2); hi=Math.max(hi,band[1]+range*.2); }
  const X=i=>PL+(W-PL-PR)*(pts.length===1?.5:i/(pts.length-1));
  const Y=v=>PT+(H-PT-PB)*(1-(v-lo)/(hi-lo));
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'">';
  if(band){
    const bT=Y(Math.min(band[1],hi)),bB=Y(Math.max(band[0],lo));
    s+='<rect class="band" x="'+PL+'" y="'+bT.toFixed(1)+'" width="'+(W-PL-PR)+'" height="'+Math.max(0,bB-bT).toFixed(1)+'"/>';
    s+='<line class="bandline" x1="'+PL+'" y1="'+bT.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+bT.toFixed(1)+'"/>';
    s+='<line class="bandline" x1="'+PL+'" y1="'+bB.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+bB.toFixed(1)+'"/>';
  }
  [0,.5,1].forEach(f=>{const y=PT+(H-PT-PB)*f;s+='<line class="grid" x1="'+PL+'" y1="'+y+'" x2="'+(W-PR)+'" y2="'+y+'"/>'});
  s+='<text class="ax" x="'+(PL-6)+'" y="'+(PT+4)+'" text-anchor="end">'+hi.toFixed(1)+'</text>';
  s+='<text class="ax" x="'+(PL-6)+'" y="'+(H-PB+3)+'" text-anchor="end">'+lo.toFixed(1)+'</text>';
  s+='<path class="ln" d="'+pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p[1]).toFixed(1)).join(' ')+'"/>';
  pts.forEach((p,i)=>{
    const bad=band&&(p[1]<band[0]||p[1]>band[1]);
    s+='<circle class="pt'+(bad?' hi':'')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p[1]).toFixed(1)+'" r="'+(i===pts.length-1?3.6:2.8)+'"/>';
  });
  const yrs=[...new Set(pts.map(p=>p[0].slice(0,4)))];
  yrs.forEach(y=>{const i=pts.findIndex(p=>p[0].slice(0,4)===y);s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-4)+'" text-anchor="middle">'+y+'</text>'});
  return s+'</svg>';
}

/* ---------------- access: consent grants + audit (connected) ---------------- */
const SCOPE_TYPES={full:['lab','rx','dx','imaging','visit','proc','vac'],labs:['lab'],imaging:['imaging']};
function fmtLeft(ms){ if(ms<=0) return '00:00';
  const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),ss=sec%60,P=n=>String(n).padStart(2,'0');
  return h>0? h+'h '+P(m)+'m' : P(m)+':'+P(ss); }
const gStatus=g=> g.revoked_at?'revoked':(Date.now()>=Date.parse(g.expires_at)?'expired':'active');

async function vAccess(){
  let h='<div class="sec"><div class="lbl">'+t('access').toUpperCase()+'</div><h1 class="ttl u">'+(S.lang==='ur'?'آپ کا والٹ کون دیکھ سکتا ہے':'Who can see your vault')+'</h1>'+
    '<p class="note u">'+(S.lang==='ur'?'محدود وقت، قابلِ منسوخ، اور مکمل ریکارڈ کے ساتھ۔':'Time-limited, revocable, and logged. Nothing is shared by default.')+'</p></div><div class="pad">';
  if(!sb()) return h+'<div class="card cardpad tiny">No backend configured.</div></div>';
  if(!S.session) return h+'<div class="card cardpad"><div class="lbl" style="margin-bottom:7px">SIGN IN FIRST</div>'+
    '<p class="note" style="margin:0 0 12px">Consent tokens must outlive this phone — the server enforces expiry and revocation. Sign in to enable sharing.</p>'+
    '<button class="btn" onclick="go(\'settings\')">Go to sign-in</button></div></div>';
  if(S.syncBlocked) return h+'<div class="simnote red">'+ICON.alert+'<span>'+esc(S.syncBlocked)+'</span></div></div>';
  h+='<button class="btn" onclick="go(\'grantnew\')">Grant new access</button>';
  const c=sb();
  const {data:gs,error}=await c.from('grants').select('*').eq('profile_id',S.profileId).order('created_at',{ascending:false}).limit(20);
  if(error) h+='<div class="tiny" style="margin-top:10px;color:var(--amber)">'+esc(error.message)+'</div>';
  const act=(gs||[]).filter(g=>gStatus(g)==='active'), past=(gs||[]).filter(g=>gStatus(g)!=='active');
  h+='<div class="lbl" style="margin:16px 0 8px">ACTIVE · '+act.length+'</div>';
  if(!act.length) h+='<div class="card cardpad tiny">No one currently has access.</div>';
  for(const g of act){
    const left=Date.parse(g.expires_at)-Date.now();
    h+='<div class="card cardpad" style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;gap:10px">'+
      '<div><div style="font-weight:600;font-size:13.5px">'+esc(g.grantee_name||'Open QR — first to scan')+'</div>'+
      '<div class="tiny">'+esc(g.scope)+' · '+esc(g.token_display)+'</div></div>'+
      '<div style="text-align:right"><div class="mono" data-cd="'+Date.parse(g.expires_at)+'" style="font-weight:600;color:var(--teal-deep)">'+fmtLeft(left)+'</div>'+
      '<div class="tiny" style="font-size:9px">EXPIRES IN</div></div></div>'+
      '<div style="height:9px"></div><div class="btnrow">'+
      '<button class="btn sm ghost" onclick="go(\'grantshow\',\''+g.id+'\')">Show QR</button>'+
      '<button class="btn sm danger" onclick="revokeGrant(\''+g.id+'\')">Revoke</button></div></div>';
  }
  if(past.length){
    h+='<div class="lbl" style="margin:16px 0 8px">PAST</div>';
    for(const g of past.slice(0,6)) h+='<div class="card cardpad" style="margin-bottom:8px;opacity:.65"><div style="display:flex;justify-content:space-between;gap:8px"><div style="font-size:12.5px;font-weight:600">'+esc(g.grantee_name||'Open QR')+'<div class="tiny">'+esc(g.scope)+' · '+esc(g.token_display)+'</div></div><span class="chip '+(g.revoked_at?'bad':'mute')+'">'+(g.revoked_at?'REVOKED':'EXPIRED')+'</span></div></div>';
  }
  h+='<div class="lbl" style="margin:16px 0 8px">ACCESS LOG</div><div class="card cardpad" id="auditbox">'+(await auditHtml())+'</div>';
  h+='<div style="height:8px"></div><div class="tiny">Every entry is hash-chained server-side — history cannot be rewritten quietly.</div>';
  return h+'</div><div style="height:16px"></div>';
}
async function auditHtml(){
  const c=sb(); if(!c||!S.profileId) return '<div class="tiny">—</div>';
  const {data:log}=await c.from('audit_log').select('seq,actor_name,action,detail,entry_hash,created_at').eq('profile_id',S.profileId).order('seq',{ascending:false}).limit(30);
  if(!log||!log.length) return '<div class="tiny">Nothing yet — the first entry appears when you grant access or sync a record.</div>';
  return log.map(l=>'<div style="display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line2);font-size:12px" class="lg1">'+
    '<div class="mono" style="font-size:9px;color:var(--faint);width:72px;flex:0 0 auto">'+esc((l.created_at||'').slice(0,10))+'<br>'+esc((l.created_at||'').slice(11,16))+'</div>'+
    '<div style="min-width:0"><b>'+esc(l.action)+'</b> · '+esc(l.actor_name)+'<div class="tiny">'+esc(l.detail)+'</div>'+
    '<div class="mono" style="font-size:8.5px;color:var(--faint);word-break:break-all">'+esc((l.entry_hash||'').slice(0,20))+'…</div></div></div>').join('');
}
async function vGrantNew(){
  if(!canSync()) return '<div class="empty">Sign in first.</div>';
  return '<div class="sec"><div class="lbl">CONSENT</div><h1 class="ttl">Grant new access</h1>'+
  '<p class="note">Scoped, time-limited, revocable. Your records sync first so the doctor sees the full picture.</p></div><div class="pad">'+
  '<div class="field"><label>Doctor / recipient (leave empty for an open QR)</label><input id="g_who" placeholder="Dr. …"></div>'+
  '<div class="field"><label>What they can see</label><select id="g_scope"><option value="full">Full vault</option><option value="labs">Labs only</option><option value="imaging">Imaging only</option></select></div>'+
  '<div class="field"><label>For how long</label><select id="g_dur"><option value="15">15 minutes</option><option value="60" selected>1 hour</option><option value="1440">24 hours</option><option value="10080">7 days</option></select></div>'+
  '<div id="g_msg"></div>'+
  '<div class="btnrow"><button class="btn ghost" onclick="go(\'access\')">Cancel</button>'+
  '<button class="btn" id="g_go" onclick="mintGrant()">Generate QR</button></div></div>';
}
async function mintGrant(){
  const btn=$('#g_go'); btn.disabled=true;
  $('#g_msg').innerHTML='<div class="tiny" style="margin-bottom:10px">Syncing records…</div>';
  try{
    await pushSync();
    const c=sb();
    const who=($('#g_who').value||'').trim()||null, scope=$('#g_scope').value, mins=+$('#g_dur').value;
    const G=rand(32), display=newDisplayToken();
    const authHash=await grantAuthHash(G);
    const ins=await c.from('grants').insert({profile_id:S.profileId,token_display:display,token_hash:authHash,
      scope:scope,grantee_name:who,expires_at:new Date(Date.now()+mins*60000).toISOString()}).select().single();
    if(ins.error) throw new Error(ins.error.message);
    const grant=ins.data;
    const recs=await loadRecords();
    const inScope=recs.filter(r=>SCOPE_TYPES[scope].includes(r.record_type)&&r._dek);
    const rows=[];
    for(const r of inScope) rows.push({grant_id:grant.id,record_id:r.id,wrapped_dek:pgHex(await wrapDekForGrant(G,r._dek,r.id))});
    if(rows.length){ const gk=await c.from('grant_keys').insert(rows); if(gk.error) throw new Error(gk.error.message); }
    await auditRpc('granted',(scope==='full'?'Full vault':scope)+' · '+(mins>=1440?(mins/1440)+' day(s)':mins+' min')+(who?' · '+who:''),grant.id);
    S._lastG={id:grant.id,G:b64u(G)};
    go('grantshow',grant.id);
  }catch(e){
    $('#g_msg').innerHTML='<div class="simnote red" style="margin-bottom:10px">'+ICON.alert+'<span>'+esc(e.message||String(e))+'</span></div>';
    btn.disabled=false;
  }
}
async function vGrantShow(gid){
  const c=sb();
  const {data:g}=await c.from('grants').select('*').eq('id',gid).single();
  if(!g) return '<div class="empty">Grant not found.</div>';
  const hasG=S._lastG&&S._lastG.id===gid;
  const url=hasG? BACKEND.gatewayUrl+'#g='+S._lastG.G : null;
  let h='<div class="sec"><div class="lbl">TIME-LIMITED ACCESS</div><h1 class="ttl">Show this to '+esc(g.grantee_name||'the clinician')+'</h1></div><div class="pad">';
  if(url) h+='<div class="qrbox" id="gqr"></div><div style="height:8px"></div><div class="tiny" style="text-align:center;word-break:break-all">'+esc(url)+'</div>';
  else h+='<div class="simnote">'+ICON.alert+'<span>The QR secret exists only at mint time (zero-knowledge). This grant\'s QR was shown once — revoke it and mint a new one if needed.</span></div>';
  h+='<div style="height:12px"></div><div class="card cardpad">'+
    '<div class="kv"><div class="k">Token</div><div class="v mono">'+esc(g.token_display)+'</div></div>'+
    '<div class="kv"><div class="k">Scope</div><div class="v">'+esc(g.scope)+'</div></div>'+
    '<div class="kv"><div class="k">Expires in</div><div class="v mono" data-cd="'+Date.parse(g.expires_at)+'">'+fmtLeft(Date.parse(g.expires_at)-Date.now())+'</div></div></div>'+
    '<div style="height:12px"></div><div class="btnrow"><button class="btn ghost danger" onclick="revokeGrant(\''+g.id+'\')">Revoke</button>'+
    '<button class="btn" onclick="go(\'access\')">Done</button></div></div>';
  setTimeout(()=>{ if(url){ try{ const box=$('#gqr'); const cv=document.createElement('canvas'); box.innerHTML=''; box.appendChild(cv);
    new QRious({element:cv,value:url,size:440,level:'M',padding:12,foreground:'#0b0f10',background:'#ffffff'});
    cv.style.width='200px'; cv.style.height='200px'; }catch(e){} } },30);
  return h;
}
async function revokeGrant(gid){
  const c=sb();
  const up=await c.from('grants').update({revoked_at:new Date().toISOString()}).eq('id',gid);
  if(up.error){ toast('Revoke failed: '+up.error.message); return; }
  await auditRpc('revoked','Access revoked by patient before expiry',gid);
  toast('Access revoked — the doctor is locked out within seconds');
  go('access');
}

/* ---------------- post-render hooks ---------------- */
function afterRender(){
  if(S.route==='add') renderDyn();
  if(S.route==='emergency'){
    readEmergency().then(e=>{
      const box=document.getElementById('eqr');
      if(!box||!e) return;
      try{
        const c=document.createElement('canvas'); box.innerHTML=''; box.appendChild(c);
        const text='MEDVAULT EMERGENCY\n'+e.name+' · '+(e.blood||'?')+'\nAllergies: '+(e.allergies||[]).join('; ')+'\nConditions: '+(e.conditions||[]).join('; ')+'\nMeds: '+(e.meds||[]).map(m=>m.n+' '+(m.d||'')).join('; ')+'\nContact: '+((e.contacts||[])[0]?e.contacts[0].n+' '+e.contacts[0].p:'—');
        new QRious({element:c,value:text.slice(0,900),size:400,level:'M',padding:10,foreground:'#0b0f10',background:'#ffffff'});
        c.style.width='200px';c.style.height='200px';
      }catch(err){ box.innerHTML='<div class="tiny">QR unavailable offline</div>'; }
    });
  }
}

/* ---------------- boot ---------------- */
function bootFail(err){
  const el=document.getElementById('gate');
  if(el) el.innerHTML='<div style="padding:24px;font-family:monospace;font-size:12px;color:#b42318;white-space:pre-wrap">BOOT ERROR\n'+String(err&&err.stack||err)+'</div>';
}
window.addEventListener('error',e=>bootFail(e.error||e.message));
window.addEventListener('unhandledrejection',e=>bootFail(e.reason));
(async function boot(){
  try{
    try{ await idb(); }catch(e){ /* storage denied -> session mode */ }
    document.body.classList.toggle('ur',S.lang==='ur');
    await sbInit();
    updateModePill();
    await renderGate();
    setInterval(()=>{ document.querySelectorAll('[data-cd]').forEach(el=>{
      const left=+el.getAttribute('data-cd')-Date.now();
      el.textContent=fmtLeft(left);
      if(left<600000) el.style.color='var(--red)';
    }); },1000);
    setInterval(async()=>{ if(S.route==='access'&&canSync()){
      const box=document.getElementById('auditbox'); if(box) box.innerHTML=await auditHtml();
    } },10000);
  }catch(err){ bootFail(err); }
})();
function updateModePill(){
  const lab=document.getElementById('modelabel'), pill=document.getElementById('modepill');
  if(!lab) return;
  let txt,online=false;
  if(S.syncBlocked){ txt='SYNC PAUSED'; }
  else if(sb()&&S.session){ txt=(STORAGE.mode==='session')?'CONNECTED · PREVIEW TAB':'CONNECTED'; online=true; }
  else if(sb()){ txt='SIGN IN FOR SYNC'; }
  else txt=(STORAGE.mode==='session')?'PREVIEW · SESSION ONLY':'DEVICE MODE';
  lab.textContent=txt;
  if(pill) pill.classList.toggle('online',online);
}
